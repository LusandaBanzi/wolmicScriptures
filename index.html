<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backdrop · clean footer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
      color: #fff;
      background: linear-gradient(
        -45deg,
        #2c1708,
        #4b2b14,
        #6f421d,
        #a96b37,
        #d39a5d,
        #8a552b,
        #3a1e0d,
        #1c0d05
      );
      background-size: 400% 400%;
      animation: gradientShift 25s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ---------- background scrolling band (seamless) ---------- */
    .bg-scroll {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .bg-scroll-track {
      display: flex;
      width: max-content;
      animation: bgScroll 220s linear infinite;
    }

    .bg-scroll-track span {
      font-size: 30vw;
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 2px rgba(218, 165, 32, 0.15);
      text-stroke: 2px rgba(218, 165, 32, 0.15);
      white-space: nowrap;
      padding-right: 6vw;
      line-height: 1;
      text-transform: uppercase;
    }

    @keyframes bgScroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* ---------- header ---------- */
    .header {
      position: absolute;
      top: 2vh;
      left: 2vw;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      z-index: 20;
      width: 96vw;
    }

    .logo {
      width: 160px;
      height: 115px;
      object-fit: fill;
    }

    .name {
      font-size: 3vw;
      font-weight: 1000;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
      color: #FFFFFF;
      -webkit-text-stroke: 2px #5A3315;
      text-stroke: 2px #5A3315;
      text-shadow: 0 0 10px #9C6B4A, 0 0 20px #F3E5D0, 2px 2px 6px #D8B08C;
    }

    /* ---------- outline + main thank you ---------- */
    .center-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      width: 100vw;
      overflow: visible;
    }

    .bg-outline {
      font-size: 23vw;
      font-weight: 900;
      color: transparent;
      -webkit-text-stroke: 2px rgba(223, 193, 168, 0.20);
      text-stroke: 2px rgba(223, 193, 168, 0.20);
      text-transform: uppercase;
      line-height: 1;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      z-index: 1;
    }

    .main-text {
      position: relative;
      font-size: 13.8vw;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
      display: inline-block;
      z-index: 10;
      background: linear-gradient(
        70deg,
        #9C6B4A, #D8B08C, #DFC1A8, #D8B08C,
        #E8C7A2, #F3E5D0, #E8C7A2, #9C6B4A,
        #D5B79A, #D8B08C
      );
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 4s ease-in-out infinite, hue 12s linear infinite;
      filter: drop-shadow(0 0 25px #6F4428);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes hue {
      from { background-position: 0% 50%; }
      to { background-position: 300% 50%; }
    }

    /* ---------- marquees ---------- */
    .marquee {
      position: absolute;
      width: 100%;
      overflow: hidden;
      z-index: 5;
    }

    .marquee.top { top: 16vh; }
    .marquee.bottom { bottom: 10vh; }

    .track {
      display: flex;
      width: max-content;
      animation: scroll 90s linear infinite;
    }

    .track span {
      margin-right: 8vw;
      font-size: 3vw;
      color: #DFC1A8;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* ---------- floating shapes ---------- */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(6px);
      opacity: .55;
      z-index: 2;
      mix-blend-mode: screen;
    }

    .s1 {
      width: 14vw; height: 14vw;
      background: radial-gradient(circle, #DFC1A8, transparent 70%);
      top: 18%; left: 15%;
      animation: float1 14s ease-in-out infinite;
    }

    .s2 {
      width: 20vw; height: 20vw;
      background: radial-gradient(circle, #daa520, transparent 70%);
      bottom: 15%; right: 12%;
      animation: float2 18s ease-in-out infinite;
    }

    .s3 {
      width: 11vw; height: 11vw;
      background: radial-gradient(circle, #DFC1A8, transparent 70%);
      top: 28%; right: 22%;
      animation: float3 12s ease-in-out infinite;
    }

    .s4 {
      width: 16vw; height: 16vw;
      background: radial-gradient(circle, #ffd700, transparent 70%);
      bottom: 22%; left: 10%;
      animation: float2 20s ease-in-out infinite reverse;
    }

    @keyframes float1 {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4vh) rotate(180deg); }
    }

    @keyframes float2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5vh); }
    }

    @keyframes float3 {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-5vw); }
    }

    /* ---------- FOOTER — clean white text, no border ---------- */
    .footer {
      position: absolute;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      max-width: 90vw;
      text-align: center;
      font-size: 2.3vw;
      font-weight: 600;
      letter-spacing: 2px;
      color: #FFFFFF;               /* pure white text */
      padding: 0.8vh 2vw;           /* breathing room, no border */
      z-index: 30;                  /* above everything */
      text-shadow: 
        0 0 12px rgba(223, 193, 168, 0.9),
        0 0 25px rgba(255, 215, 0, 0.6),
        0 0 40px rgba(218, 165, 32, 0.4);
      white-space: nowrap;
    }

    /* responsive tweak for smaller screens */
    @media (max-width: 700px) {
      .footer {
        font-size: 1.8rem;
        padding: 0.6rem 1.2rem;
        white-space: normal;
        line-height: 1.3;
      }
    }

    /* ---------- glow (kept subtle) ---------- */
    .glow {
      position: absolute;
      width: 60vw;
      height: 60vw;
      max-width: 900px;
      max-height: 900px;
      background: radial-gradient(circle, #DFC1A8, #C79668, #6F4428, transparent 70%);
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: glowPulse 8s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: .7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="logo.png" class="logo" alt="Church Logo" onerror="this.style.display='none'">
    <div class="name">
      WORD OF LIFE MINISTRIES INTERNATIONAL CHURCH
    </div>
  </div>

  <!-- Floating Shapes -->
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>

  <!-- Optional glow, very subtle -->
  <div class="glow" style="z-index:0; opacity:0.15; pointer-events:none;"></div>

  <!-- FOOTER — pure white text, no border, strong glow for visibility -->
  <footer class="footer">
    “TO FIND THE LOST AND KEEP THE FOUND”
  </footer>

  <script>
    // Soft blur breathing on floating shapes
    const shapes = document.querySelectorAll('.shape');
    setInterval(() => {
      shapes.forEach(shape => {
        shape.style.filter = `blur(${4 + Math.random() * 6}px)`;
      });
    }, 2500);
  </script>

</body>
</html>
